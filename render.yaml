# Render blueprint for the AI Ladder web build.
#
# The web target is a single-page app: `web.output` is "single" in app.json
# because static prerendering runs every route in Node, where the browser APIs
# the app boots on (IndexedDB, localStorage, wasm) do not exist.
#
# Because it is an SPA, every path has to fall through to index.html or a
# refresh on /progress returns a 404.
services:
  - type: web
    name: ai-ladder
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false

    # EXPO_PUBLIC_* values are inlined at build time, so these must be present
    # in Render's environment or the deployed site ships unable to sync.
    envVars:
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Hashed bundles are immutable: a new build produces a new filename, so
      # these can be cached hard and forever.
      - path: /_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # The shell must never be cached. Render's default (s-maxage=300) meant
      # the CDN kept serving an index.html pointing at the previous bundle for
      # five minutes after every deploy, so a reload right after shipping ran
      # the old code and looked like the fix had not worked.
      - path: /*
        name: Cache-Control
        value: no-cache, must-revalidate

      # sql.js fetches its wasm at runtime; a wrong content type makes
      # WebAssembly.instantiate reject the response.
      - path: /*.wasm
        name: Content-Type
        value: application/wasm
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

# The nightly ingest job is not declared here. Render cron jobs require a paid
# plan, so it runs as a GitHub Actions schedule instead, in
# .github/workflows/ingest.yml. The job is host-agnostic: it needs only
# DATABASE_URL, so moving it back here later is a one-line change.
